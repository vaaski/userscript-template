name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - run: bun install
      - run: bun run build

      - uses: actions/upload-artifact@v7
        with:
          path: out/index.user.js
          archive: false
